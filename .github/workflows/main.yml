
name: Docker-Push-WorkFlow

on:
  workflow_run:
    workflows: ["CI-WorkFlow"]
    types:
      - completed

env:
  FOO_IMAGE_NAME: shaikhtanveer392/myflaskapp
  FOO_IMAGE_VERSION: v7

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose images
        run: |
          docker compose -f ./session-3/part-3/docker-compose.yaml build

      - name: Push Docker Compose images
        run: |
          docker compose -f ./session-3/part-3/docker-compose.yaml push

